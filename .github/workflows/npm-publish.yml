name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC / trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing requires GitHub-hosted runners
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: node tests/notify.test.mjs && node tests/host-routes.test.mjs

      # Trusted publishing (OIDC): no token needed; provenance is generated
      # automatically for public repos/packages.
      - name: Publish
        run: npm publish
